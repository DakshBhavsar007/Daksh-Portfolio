<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FBFBFB"/>
      <stop offset="100%" stop-color="#F3F3F7"/>
    </linearGradient>
    <linearGradient id="ribbonPurple" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#C7B8E8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#DEC8D6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F5DDD8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E2D0E6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ribbonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4EE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D7EBDD" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D4E4DF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35   0 0 0 0 0.55   0 0 0 0 0.98  0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Flowing 3D Silk Ribbons (matching the real Between UI) -->
  <path d="M -50,300 C 120,260 220,440 450,470 C 700,500 850,290 1250,460 L 1250,560 C 850,380 700,580 450,550 C 220,520 120,360 -50,400 Z" fill="url(#ribbonPurple)" opacity="0.9" filter="url(#softShadow)"/>
  <path d="M -50,320 C 140,240 280,310 500,430 C 750,560 920,420 1250,330 L 1250,410 C 920,500 750,640 500,510 C 280,390 140,320 -50,400 Z" fill="#E8D5F2" opacity="0.6"/>
  <path d="M 600,280 C 800,260 980,320 1250,440 L 1250,380 C 980,260 800,210 600,230 Z" fill="url(#ribbonGreen)" opacity="0.75"/>

  <!-- Top Navbar -->
  <g id="navbar">
    <rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" fill-opacity="0.9" stroke="#EEEEEE" stroke-width="1"/>
    
    <!-- Between Logo -->
    <g transform="translate(48, 22)">
      <!-- Linked circles logo -->
      <circle cx="10" cy="13" r="7" fill="#1B4DFF"/>
      <circle cx="21" cy="13" r="5" fill="#3B82F6"/>
      <rect x="10" y="8" width="11" height="10" fill="#1B4DFF" opacity="0.5"/>
      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#111111" letter-spacing="-0.5">Between</text>
    </g>

    <!-- Nav Links -->
    <g transform="translate(370, 39)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#4B5563">
      <text x="0" y="0">Product ▾</text>
      <text x="95" y="0">Features</text>
      <text x="180" y="0">Pricing</text>
      <text x="255" y="0">Jobs</text>
      <text x="315" y="0">Developers</text>
    </g>

    <!-- Nav Right Controls -->
    <g transform="translate(950, 18)">
      <circle cx="20" cy="17" r="14" fill="none" stroke="#E5E7EB" stroke-width="1"/>
      <path d="M 17,11 A 6,6 0 0,0 23,23 A 7,7 0 1,1 17,11 Z" fill="#4B5563"/>
      
      <circle cx="56" cy="17" r="14" fill="none" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="50" cy="17" r="1.5" fill="#4B5563"/>
      <circle cx="56" cy="17" r="1.5" fill="#4B5563"/>
      <circle cx="62" cy="17" r="1.5" fill="#4B5563"/>

      <!-- Dashboard Button -->
      <rect x="85" y="2" width="120" height="34" rx="17" fill="#1F242D"/>
      <text x="110" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Dashboard &gt;</text>
    </g>
  </g>

  <!-- Hero Content Center -->
  <g transform="translate(600, 160)" text-anchor="middle">
    
    <!-- Announcement Pill -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="0" width="190" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#softShadow)"/>
      <rect x="-89" y="5" width="34" height="18" rx="9" fill="#2563EB"/>
      <text x="-72" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">NEW</text>
      <text x="5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#374151" text-anchor="middle">Between 1.0 is live  &gt;</text>
    </g>

    <!-- Main Headline with Blue Glow Layer -->
    <text x="0" y="105" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" fill="#111827" letter-spacing="-1.5">
      Screen resumes with
    </text>
    
    <!-- Glowing surgical precision word -->
    <g filter="url(#blueGlow)">
      <text x="0" y="170" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" fill="#4B7BFF" letter-spacing="-1.5">
        surgical precision.
      </text>
    </g>
    <text x="0" y="170" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" fill="#2952E3" letter-spacing="-1.5">
      surgical precision.
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#4B5563">
      Build recruitment workflows that work. Automate screening, rank
    </text>
    <text x="0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#4B5563">
      candidates, and streamline hiring with surgical precision — powered
    </text>
    <text x="0" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#4B5563">
      by specialized AI agents.
    </text>

    <!-- CTA Buttons -->
    <g transform="translate(0, 335)">
      <!-- Developer Portal Button -->
      <rect x="-185" y="0" width="170" height="46" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#softShadow)"/>
      <text x="-100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Developer Portal  &lt;/&gt;</text>

      <!-- Go to Dashboard Button -->
      <rect x="5" y="0" width="180" height="46" rx="10" fill="#1F242D" filter="url(#softShadow)"/>
      <text x="95" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Go to Dashboard  →</text>
    </g>
  </g>
</svg>
