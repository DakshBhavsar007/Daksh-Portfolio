<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sevaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAFCFF"/>
      <stop offset="100%" stop-color="#F4F8FC"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#sevaBg)"/>

  <!-- Top Navigation Bar -->
  <g id="sevaNav">
    <rect width="1200" height="70" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>

    <!-- Seva Setu Logo -->
    <g transform="translate(50, 16)">
      <!-- Crest emblem -->
      <circle cx="18" cy="18" r="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
      <path d="M 18,9 C 14,14 11,18 11,22 C 11,26 14,28 18,28 C 22,28 25,26 25,22 C 25,18 22,14 18,9 Z" fill="#2E7D32"/>
      <circle cx="18" cy="20" r="3" fill="#FFC107"/>
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#1B5E20" letter-spacing="-0.3">SEVA SETU</text>
    </g>

    <!-- Nav Menu Links -->
    <g transform="translate(320, 40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#4B5563">
      <!-- Active Home Link with underline -->
      <text x="0" y="0" font-weight="700" fill="#1D4ED8">Home</text>
      <line x1="-2" y1="6" x2="38" y2="6" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>

      <text x="80" y="0">Features</text>
      <text x="175" y="0">How it Works</text>
      <text x="295" y="0">Pricing</text>
    </g>

    <!-- Right Actions -->
    <g transform="translate(890, 16)">
      <!-- Install App Button -->
      <rect x="0" y="3" width="120" height="34" rx="8" fill="#2563EB"/>
      <path d="M 15,18 L 19,22 L 23,18 M 19,12 L 19,22 M 13,24 L 25,24" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Install App</text>

      <!-- Dashboard Button -->
      <rect x="130" y="3" width="125" height="34" rx="8" fill="#1F242D"/>
      <text x="145" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Dashboard ↗</text>
    </g>
  </g>

  <!-- Hero Content Center -->
  <g transform="translate(600, 165)" text-anchor="middle">
    <!-- Category Pill -->
    <rect x="-80" y="0" width="160" height="26" rx="13" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="1.2">FOR COMMUNITIES</text>

    <!-- Headline -->
    <text x="0" y="85" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="800" fill="#111827" letter-spacing="-1">
      Empowering communities
    </text>
    <text x="0" y="145" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="800" fill="#111827" letter-spacing="-1">
      through smart volunteering.
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#4B5563">
      From volunteer onboarding, to smart matching, to impact tracking—
    </text>
    <text x="0" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#4B5563">
      manage your entire social impact pipeline in one place.
    </text>

    <!-- CTA Buttons -->
    <g transform="translate(0, 270)">
      <!-- Orange Get Volunteer App -->
      <rect x="-215" y="0" width="210" height="46" rx="8" fill="url(#orangeBtn)" filter="url(#cardShadow)"/>
      <text x="-110" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">Get the Volunteer App  ↓</text>

      <!-- Admin Dashboard Button -->
      <rect x="15" y="0" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)"/>
      <text x="105" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#1F2937">Admin Dashboard  ↗</text>
    </g>

    <!-- 4 Bottom Metrics Cards (matching exact screenshot) -->
    <g transform="translate(-400, 360)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="110" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" filter="url(#cardShadow)"/>
        <!-- Purple People Icon -->
        <circle cx="90" cy="30" r="10" fill="#6366F1" fill-opacity="0.15"/>
        <text x="90" y="34" font-size="14" fill="#6366F1" text-anchor="middle">👥</text>
        <text x="90" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#4F46E5" text-anchor="middle">0</text>
        <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Active Volunteers</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(205, 0)">
        <rect width="180" height="110" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="90" y="34" font-size="14" fill="#EC4899" text-anchor="middle">📍</text>
        <text x="90" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0D9488" text-anchor="middle">0</text>
        <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Active Campaigns</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(410, 0)">
        <rect width="180" height="110" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="90" y="34" font-size="14" fill="#10B981" text-anchor="middle">✅</text>
        <text x="90" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#2563EB" text-anchor="middle">0%</text>
        <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Task Completion</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(615, 0)">
        <rect width="180" height="110" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="90" y="34" font-size="14" fill="#F59E0B" text-anchor="middle">⭐</text>
        <text x="90" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#D97706" text-anchor="middle">0★</text>
        <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">User Rating</text>
      </g>
    </g>
  </g>
</svg>
