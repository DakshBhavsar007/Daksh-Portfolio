<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="testDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07080E"/>
      <stop offset="50%" stop-color="#05060A"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="cyanPurpleText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid & Glow -->
  <rect width="1200" height="675" fill="url(#testDarkBg)"/>
  <rect width="1200" height="675" fill="url(#gridPattern)"/>

  <!-- Subtle Radial Glow behind headline -->
  <circle cx="600" cy="320" r="280" fill="#3B82F6" fill-opacity="0.06" filter="url(#cyanGlow)"/>

  <!-- Top Navbar -->
  <g id="testNav">
    <rect width="1200" height="65" fill="#090B10" fill-opacity="0.9" stroke="#171C26" stroke-width="1"/>

    <!-- TestVerse Logo -->
    <g transform="translate(45, 18)">
      <!-- Purple Lightning Icon Box -->
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#818CF8"/>
      <path d="M 16,6 L 10,17 L 15,17 L 14,24 L 20,13 L 15,13 Z" fill="#FFFFFF"/>
      <text x="38" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">TestVerse</text>
    </g>

    <!-- Nav Menu -->
    <g transform="translate(220, 37)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">
      <text x="0" y="0">Core ▾</text>
      <text x="65" y="0">Testing ▾</text>
      <text x="145" y="0">Ops &amp; CI ▾</text>
      <text x="235" y="0">Team ▾</text>
      <text x="305" y="0">Config ▾</text>
    </g>

    <!-- Right Actions -->
    <g transform="translate(860, 16)">
      <!-- Search Pill -->
      <rect x="0" y="3" width="110" height="28" rx="6" fill="#141822" stroke="#252D3D" stroke-width="1"/>
      <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">🔍 Search... ⌘K</text>

      <!-- New Test Button -->
      <rect x="125" y="0" width="105" height="34" rx="8" fill="#6366F1"/>
      <text x="142" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">+ New Test</text>

      <!-- AD User Avatar -->
      <circle cx="255" cy="17" r="14" fill="#A855F7"/>
      <text x="255" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">AD</text>
    </g>
  </g>

  <!-- Hero Content Center -->
  <g transform="translate(600, 190)" text-anchor="middle">
    
    <!-- AI Automated Testing Pill -->
    <g transform="translate(0, 0)">
      <rect x="-130" y="0" width="260" height="28" rx="14" fill="#0C1322" stroke="#1E293B" stroke-width="1"/>
      <circle cx="-108" cy="14" r="3.5" fill="#34D399"/>
      <text x="5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.2">AI-POWERED AUTOMATED TESTING</text>
    </g>

    <!-- Huge Bold Headline (Matching Exact Screenshot) -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
      Analyze your
    </text>
    
    <!-- website's in glowing gradient -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="58" font-weight="900" fill="url(#cyanPurpleText)" letter-spacing="-1.5" filter="url(#cyanGlow)">
      website's
    </text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="58" font-weight="900" fill="url(#cyanPurpleText)" letter-spacing="-1.5">
      website's
    </text>

    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
      health in seconds.
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      Expert-level audits for uptime, speed, security, and mobile performance.
    </text>
    <text x="0" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      No setup required.
    </text>

    <!-- Interactive Card Module Bottom Preview -->
    <g transform="translate(-200, 360)">
      <rect width="400" height="90" rx="14" fill="#0E131F" stroke="#1E293B" stroke-width="1"/>
      <rect x="15" y="15" width="110" height="34" rx="8" fill="#6366F1"/>
      <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Basic Audit</text>
      <text x="195" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Login Automation</text>
    </g>
  </g>
</svg>
