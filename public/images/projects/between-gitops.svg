    <rect x="20" y="20" width="230" height="34" rx="8" fill="#326CE5" fill-opacity="0.2" stroke="#326CE5" stroke-width="1.5"/>
    <text x="135" y="42" fill="#DBEAFE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
