  <g transform="translate(945, 120)">
    <rect width="185" height="480" rx="14" fill="url(#cardGrad)" stroke="#FF9900" stroke-width="1.5"/>

    <rect x="15" y="20" width="155" height="34" rx="8" fill="#FF9900" fill-opacity="0.2" stroke="#FF9900" stroke-width="1.5"/>
    <text x="92" y="42" fill="#FED7AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
      4. AWS SERVICES
    </text>

    <!-- AWS RDS Card -->
    <rect x="15" y="75" width="155" height="120" rx="10" fill="#0F172A" stroke="#FF9900" stroke-opacity="0.5" stroke-width="1"/>
    <text x="25" y="100" fill="#FDBA74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">AWS RDS PostgreSQL</text>
    <text x="25" y="122" fill="#E2E8F0" font-family="monospace" font-size="10.5">PostgreSQL 15.13</text>
    <text x="25" y="142" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Instance: db.t4g.micro</text>
    <text x="25" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Private Subnet SG Isolated</text>
    <text x="25" y="182" fill="#10B981" font-family="monospace" font-size="10">Automated Daily Backups</text>

    <!-- Route 53 Card -->
    <rect x="15" y="210" width="155" height="110" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="25" y="235" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Route 53 DNS</text>
    <text x="25" y="258" fill="#38BDF8" font-family="monospace" font-size="10">between.dakshaws</text>
    <text x="25" y="275" fill="#38BDF8" font-family="monospace" font-size="10">.sryze.cc</text>
    <text x="25" y="302" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">HTTPS Encrypted</text>

    <!-- Cost Toggle Automation Card -->
    <rect x="15" y="335" width="155" height="110" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="360" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Cost-Toggle Script</text>
    <text x="25" y="382" fill="#E2E8F0" font-family="monospace" font-size="9.5">Between-AWS-Toggle.bat</text>
    <text x="25" y="402" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">One-click EC2+RDS stop</text>
    <text x="25" y="422" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Zero idle cloud charges</text>
  </g>

  <!-- Bottom Tech Pills Bar -->
  <g transform="translate(70, 620)">
    <text x="0" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TECH STACK:</text>
    <text x="90" y="16" fill="#94A3B8" font-family="monospace" font-size="11.5">
      k3s Kubernetes • ArgoCD • AWS EC2 &amp; RDS • Docker • GitHub Actions • GHCR • Traefik Ingress • Let's Encrypt TLS • Django • React • Celery • Redis
    </text>
  </g>
</svg>