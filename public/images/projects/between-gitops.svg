    </text>

    <!-- Pods Grid -->
    <!-- Ingress Pod -->
    <rect x="20" y="70" width="230" height="55" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="32" y="93" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Ingress: Traefik</text>
    <text x="32" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Let's Encrypt TLS (HTTP-01) • Ports 80 &amp; 443</text>

    <!-- Frontend Pod -->
    <rect x="20" y="135" width="230" height="60" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
    <text x="32" y="158" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Pod: react-frontend</text>
    <text x="32" y="178" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">React 18 + Vite 8 SPA • Nginx Static Serve</text>

    <!-- Backend Pod -->
    <rect x="20" y="205" width="230" height="65" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="32" y="228" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Pod: django-backend</text>
    <text x="32" y="246" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Django 5 + 12 Multi-Agent LLMs</text>
    <text x="32" y="262" fill="#CBD5E1" font-family="monospace" font-size="10">Multi-key Gemini API rotation</text>

    <!-- Celery & Redis Pods -->
    <rect x="20" y="280" width="110" height="70" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="28" y="303" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Pod: Celery</text>
    <text x="28" y="323" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Async Tasks</text>
    <text x="28" y="338" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Worker Queue</text>

    <rect x="140" y="280" width="110" height="70" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="148" y="303" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Pod: Redis 7</text>
    <text x="148" y="323" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Cache / Auth</text>
    <text x="148" y="338" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Broker</text>

    <!-- Node Spec Badge -->
    <rect x="20" y="365" width="230" height="85" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="32" y="390" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">AWS EC2 t3.small Host</text>
    <text x="32" y="410" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Ubuntu 24.04 LTS (ap-south-1)</text>
    <text x="32" y="430" fill="#38BDF8" font-family="monospace" font-size="10.5">k3s v1.29+k3s1 lightweight runtime</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 910 360 L 935 360" stroke="#FF9900" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="940,360 930,354 930,366" fill="#FF9900"/>

