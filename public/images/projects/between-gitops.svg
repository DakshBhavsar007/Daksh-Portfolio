    <text x="32" y="425" fill="#10B981" font-family="monospace" font-size="11">maxSurge: 1 | maxUnavail: 0</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 580 360 L 620 360" stroke="#326CE5" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="625,360 615,354 615,366" fill="#326CE5"/>

