<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="twinkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Circular Badge Frame -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#333333" stroke-width="2"/>
  
  <!-- Subtle Ambient Particle Star / Gemini Orb Sparkle -->
  <circle cx="32" cy="32" r="22" fill="url(#twinkleGlow)"/>
  
  <!-- Astroid 4-point twinkle sparkle like Gemini/BrandOrb -->
  <path d="M32 14 Q32 32 14 32 Q32 32 32 50 Q32 32 50 32 Q32 32 32 14 Z" fill="#60a5fa" opacity="0.35"/>
  
  <!-- DB Monogram Typography -->
  <text 
    x="32" 
    y="40" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" 
    font-size="22" 
    font-weight="900" 
    letter-spacing="-1.5" 
    fill="#ffffff"
  >DB</text>
  
  <!-- Pulse Activity Dot in Top-Right -->
  <circle cx="48" cy="16" r="3.5" fill="#10b981" stroke="#0a0a0a" stroke-width="1.5"/>
</svg>